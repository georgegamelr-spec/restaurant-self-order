version: '3.8'

services:

  # ─── PostgreSQL Database ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       restaurant
      POSTGRES_USER:     restaurant_user
      POSTGRES_PASSWORD: restaurant_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgREST (Supabase-compatible REST API) ──────────
  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: restaurant_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI:             postgres://restaurant_user:restaurant_pass@postgres:5432/restaurant
      PGRST_DB_SCHEMAS:         public
      PGRST_DB_ANON_ROLE:       restaurant_anon
      PGRST_JWT_SECRET:         super-secret-jwt-token-for-offline-use-min-32-chars
      PGRST_DB_POOL:            10
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    ports:
      - "3001:3000"

  # ─── Next.js App ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:                      production
      NEXT_PUBLIC_SUPABASE_URL:      http://localhost:3001
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTcwMDAwMDAwMH0.placeholder
      SUPABASE_SERVICE_ROLE_KEY:     eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzAwMDAwMDAwfQ.placeholder
      DATABASE_URL:                  postgresql://restaurant_user:restaurant_pass@postgres:5432/restaurant
      NEXT_PUBLIC_RESTAURANT_NAME:   "مطعمي"
    ports:
      - "3000:3000"
    volumes:
      - ./.env.local:/app/.env.local:ro

volumes:
  postgres_data:
    driver: local
